name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --all-extras
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict

  tests:
    name: tests (${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Run the tests with the locked versions
        if: matrix.resolution == 'highest'
        run: uv run --python ${{ matrix.python }} pytest tests
      - name: Run the tests with the lowest allowed direct versions
        if: matrix.resolution == 'lowest-direct'
        run: uv run --isolated --resolution lowest-direct --python ${{ matrix.python }} pytest tests
      - name: Fail if a tracked file changed
        run: git diff --exit-code

  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Fail if Streamlit is installed
        run: uv run --isolated --python 3.12 --no-dev --group test python -c "import importlib.util; assert importlib.util.find_spec('streamlit') is None"
      - name: Run the tests without any backend installed
        run: uv run --isolated --python 3.12 --no-dev --group test pytest tests --no-cov
      - name: Fail if a tracked file changed
        run: git diff --exit-code

  streamlit-floor:
    name: streamlit-floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Fail unless Streamlit 1.47.0 is the one imported
        run: uv run --python 3.12 --with "streamlit==1.47.0" python -c "import streamlit; assert streamlit.__version__ == '1.47.0'"
      - name: Run the Streamlit tests against the lowest supported Streamlit
        run: uv run --python 3.12 --with "streamlit==1.47.0" pytest tests/backends --no-cov
      - name: Fail if a tracked file changed
        run: git diff --exit-code

  coverage-badge:
    name: coverage-badge
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Measure the coverage
        run: |
          uv run --python 3.12 pytest tests
          uv run --python 3.12 coverage json -o "$RUNNER_TEMP/coverage-report.json"
          python3 scripts/coverage_badge.py "$RUNNER_TEMP/coverage-report.json" "$RUNNER_TEMP/coverage.json"
      - name: Publish the badge file
        run: |
          git switch --orphan badges
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --message ":bar_chart: Update the coverage badge"
          git push --force origin badges

  ci:
    name: ci
    if: always()
    needs: [checks, tests, core, streamlit-floor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          CORE: ${{ needs.core.result }}
          STREAMLIT_FLOOR: ${{ needs.streamlit-floor.result }}
        run: test "$CHECKS" = success && test "$TESTS" = success && test "$CORE" = success && test "$STREAMLIT_FLOOR" = success
